[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shapeloop-cad"
version = "0.1.0"
description = "Local-first parametric CAD workbench with measured geometry contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "cadquery==2.5.2", "cadquery-ocp==7.7.2", "numpy==2.5.3",
  "nlopt==2.11.0", "casadi==3.8.1", "ezdxf==1.4.4",
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "typer==0.15.3", "click==8.1.8", "httpx==0.28.1", "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "hypothesis==6.131.9", "build==1.2.2.post1"]

[project.urls]
Repository = "https://github.com/mikamikasuki/ShapeLoop-CAD"
Issues = "https://github.com/mikamikasuki/ShapeLoop-CAD/issues"

[project.scripts]
shapeloop-cad = "shapeloop.cli:app"
shapeloop = "shapeloop.cli:app"

[tool.setuptools.packages.find]
include = ["shapeloop*"]

[tool.setuptools.package-data]
shapeloop = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["geometry: real OpenCascade integration", "slow: generated workflow integration"]
